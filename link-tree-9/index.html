@font-face{font-family:'Baloo 2';font-style:normal;font-weight:400 800;font-display:swap;src:url(/assets/fonts/baloo2.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/fonts/hanken.woff2) format('woff2')}
:root{
  --turquoise:#12b3c4;--teal-deep:#0a6a72;--teal-ink:#08464c;--ocean:#0e6f9e;
  --sky:#7fd0ef;--sky-soft:#d9f1fb;--sand:#f6ead1;--cream:#fffaf0;
  --lime:#8cc63f;--lime-deep:#5f8f22;--gold:#f4b731;--gold-deep:#b47b06;--coral:#f26a3f;
  --ink:#1f3238;--ink-soft:#4a5f66;--line:#e7dcc4;--white:#fff;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:14px;--radius-lg:22px;--radius-pill:999px;
  --shadow-sm:0 2px 8px rgba(8,70,76,.08);--shadow:0 10px 30px rgba(8,70,76,.12);--shadow-lg:0 24px 60px rgba(8,70,76,.18);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--f-body);color:var(--ink);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;

    var(--cream);
}
img{max-width:100%;display:block}
a{color:var(--teal-deep);text-decoration:none}
h1{font-family:var(--f-display);line-height:1.06;margin:0;color:var(--teal-ink);letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--ocean);outline-offset:3px;border-radius:12px}

.wrap{width:100%;max-width:460px;padding:38px 20px 30px;text-align:center}
.logo{width:128px;height:128px;margin:0 auto 16px;filter:drop-shadow(var(--shadow))}
h1{font-size:clamp(1.55rem,6vw,1.95rem);font-weight:800}
.loc{display:inline-flex;align-items:center;gap:9px;margin:8px 0 0;font-family:var(--f-display);font-weight:700;
  font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-deep)}
.loc::before{content:"";width:22px;height:3px;border-radius:3px;background:var(--gold)}
.beads{height:16px;width:150px;margin:18px auto 26px;
  background-image:radial-gradient(circle,var(--lime) 42%,transparent 46%),radial-gradient(circle,var(--gold) 42%,transparent 46%);
  background-size:26px 16px,26px 16px;background-position:0 center,13px center;background-repeat:repeat-x;opacity:.9}

.socials{display:flex;justify-content:center;gap:14px;margin:0 0 26px}
.social{display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:var(--radius-pill);
  background:var(--white);color:var(--teal-deep);box-shadow:var(--shadow-sm);border:1px solid var(--line);
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease,color .15s ease}
.social:hover{transform:translateY(-3px);background:var(--teal-deep);color:#fff;box-shadow:var(--shadow)}
.social svg{width:23px;height:23px}

.links{display:flex;flex-direction:column;gap:14px}
.link{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:var(--radius-lg);
  font-family:var(--f-display);font-weight:700;font-size:1.06rem;box-shadow:var(--shadow-sm);
  transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}
.link:hover{transform:translateY(-2px);box-shadow:var(--shadow);filter:brightness(1.02)}
.link .ic{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--radius-pill)}
.link .ic svg{width:20px;height:20px}
.link .lbl{flex:1 1 auto;text-align:left}
.link .arw{flex:0 0 auto;opacity:.55}
.link .arw svg{width:18px;height:18px}
.link--teal{background:var(--teal-deep);color:#fff}
.link--teal .ic{background:rgba(255,255,255,.16)}
.link--gold{background:var(--gold);color:#3a2a05}
.link--gold .ic{background:rgba(58,42,5,.14)}

.foot{margin:30px 0 4px;font-size:.82rem;color:var(--ink-soft)}
.foot a{color:var(--teal-deep);font-weight:600}
</style>
